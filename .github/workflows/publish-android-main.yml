name: Publish signed Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-android-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APK_OBJECT: gs://olive-21239.firebasestorage.app/public/android/olive-branch.apk
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set build version
        run: |
          echo "OLIVE_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "OLIVE_VERSION_NAME=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Configure release signing and app services
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$GEOAPIFY_API_KEY" || { echo 'Missing GEOAPIFY_API_KEY'; exit 1; }
          test -n "$MAPBOX_ACCESS_TOKEN" || { echo 'Missing MAPBOX_ACCESS_TOKEN'; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > release-signing.jks
          {
            printf 'storeFile=release-signing.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=oliveRelease\n'
            printf 'keyPassword=%s\n' "$STORE_PASSWORD"
          } > keystore.properties
          {
            printf 'GEOAPIFY_API_KEY=%s\n' "$GEOAPIFY_API_KEY"
            printf 'MAPBOX_ACCESS_TOKEN=%s\n' "$MAPBOX_ACCESS_TOKEN"
            printf 'REALTIME_DATABASE_URL=https://olive-21239-default-rtdb.firebaseio.com\n'
          } > local.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: olive-branch-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Update Android QR download
        run: |
          gsutil \
            -h 'Cache-Control:no-cache, max-age=0' \
            -h 'Content-Type:application/vnd.android.package-archive' \
            -h 'Content-Disposition:attachment; filename="olive-branch.apk"' \
            cp app/build/outputs/apk/release/app-release.apk "$APK_OBJECT"
