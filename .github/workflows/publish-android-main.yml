name: Publish latest Android debug app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-android-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_OBJECT: gs://olive-21239.firebasestorage.app/public/android/olive-branch.apk
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: olive-android-debug-keystore-v1

      - name: Set build version
        run: |
          echo "OLIVE_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "OLIVE_VERSION_NAME=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Configure app services
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          REALTIME_DATABASE_URL: ${{ secrets.REALTIME_DATABASE_URL }}
        run: |
          {
            printf 'GEOAPIFY_API_KEY=%s\n' "$GEOAPIFY_API_KEY"
            printf 'MAPBOX_ACCESS_TOKEN=%s\n' "$MAPBOX_ACCESS_TOKEN"
            printf 'REALTIME_DATABASE_URL=%s\n' "$REALTIME_DATABASE_URL"
          } > local.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Locate debug APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk olive-branch.apk

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Publish stable Android download
        run: |
          gsutil \
            -h 'Cache-Control:no-cache, max-age=0' \
            -h 'Content-Type:application/vnd.android.package-archive' \
            -h 'Content-Disposition:attachment; filename="olive-branch.apk"' \
            cp olive-branch.apk "$APK_OBJECT"
