name: Deployment Status

on:
  push:
    branches: [main]

jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SITE_URL: ${{ vars.SITE_URL }}

    steps:
      - name: Notify Building
        if: env.WEBHOOK_URL != ''
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request

          payload = {
              "embeds": [{
                  "title": "⏳ Building & Deploying",
                  "description": f"New push to `{os.environ['REF']}` by **{os.environ['ACTOR']}**",
                  "color": 16761095,
                  "fields": [
                      {"name": "Commit", "value": f"`{os.environ['SHA'][:7]}`", "inline": True},
                      {"name": "Logs", "value": f"[View Workflow]({os.environ['RUN_URL']})", "inline": True}
                  ]
              }]
          }

          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Deploy-Notifier"}
          )
          urllib.request.urlopen(req)
          EOF
        env:
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & Build
        id: build
        run: |
          set -o pipefail
          npm --prefix web ci --ignore-scripts 2>&1 | tee build.log
          DISCORD_WEBHOOK_URL="" npm --prefix web run build 2>&1 | tee -a build.log

      - name: Verify Live Site on Hostinger
        id: live_check
        if: env.SITE_URL != ''
        run: |
          python3 - << 'EOF'
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          DEFAULT_URL = "https://yourolivebranch.ca"
          raw = os.environ.get("SITE_URL", "").strip().strip('"').strip("'").strip()
          if not raw:
              raw = DEFAULT_URL
          if "://" not in raw:
              raw = f"https://{raw}"

          parsed = urllib.parse.urlparse(raw)
          if parsed.scheme not in ("http", "https") or not parsed.netloc:
              print(f"Invalid SITE_URL {raw!r}; falling back to {DEFAULT_URL}", flush=True)
              target_url = f"{DEFAULT_URL}/api/health"
          elif parsed.path in ("", "/"):
              target_url = f"{parsed.scheme}://{parsed.netloc}/api/health"
          else:
              target_url = raw

          print(f"Checking live site at: {target_url}", flush=True)
          time.sleep(15)

          last_status = "No response"
          headers = {
              "User-Agent": "OliveWeb-Deploy-Check/1.0",
              "Accept": "application/json, text/html, */*",
          }

          for attempt in range(1, 13):
              try:
                  req = urllib.request.Request(target_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      code = resp.status
                      last_status = f"HTTP {code}"
                      print(f"Check {attempt}: {last_status} ({target_url})", flush=True)
                      if 200 <= code < 400:
                          raise SystemExit(0)
              except urllib.error.HTTPError as exc:
                  last_status = f"HTTP {exc.code}"
                  print(f"Check {attempt}: {last_status} ({target_url})", flush=True)
              except SystemExit:
                  raise
              except Exception as exc:
                  last_status = f"{type(exc).__name__}: {exc}"
                  print(f"Check {attempt}: {last_status} ({target_url})", flush=True)

              if attempt < 12:
                  time.sleep(10)

          with open("health.log", "w", encoding="utf-8") as fh:
              fh.write(f"Last status: {last_status} for {target_url}\n")
          raise SystemExit(1)
          EOF

      - name: Notify Success
        if: success() && env.WEBHOOK_URL != ''
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request

          payload = {
              "embeds": [{
                  "title": "✅ Deployment Successful",
                  "description": f"`{os.environ['REF']}` built cleanly and live site responded OK.",
                  "color": 3066993,
                  "fields": [
                      {"name": "Commit", "value": f"`{os.environ['SHA'][:7]}`", "inline": True},
                      {"name": "Logs", "value": f"[View Workflow]({os.environ['RUN_URL']})", "inline": True}
                  ]
              }]
          }

          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Deploy-Notifier"}
          )
          urllib.request.urlopen(req)
          EOF
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify Failure + Reason
        if: failure() && env.WEBHOOK_URL != ''
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request

          build_outcome = os.environ.get("BUILD_OUTCOME", "")
          live_outcome = os.environ.get("LIVE_OUTCOME", "")

          if build_outcome == "failure":
              lines = open("build.log").read().splitlines()[-10:] if os.path.exists("build.log") else []
              snippet = "\n".join(lines)[-800:] if lines else "Check workflow logs"
              reason = f"**Build / npm ci failed:**\n{snippet}"
          elif live_outcome == "failure":
              status = open("health.log").read().strip() if os.path.exists("health.log") else "No 2xx/3xx response"
              reason = f"**Hostinger live check failed** ({status}). Hostinger git deploy or server startup likely failed—check hPanel deploy logs."
          else:
              reason = "Workflow failed before build completed. Check workflow logs."

          payload = {
              "embeds": [{
                  "title": "❌ Deployment Failed",
                  "description": reason[:2000],
                  "color": 15158332,
                  "fields": [
                      {"name": "Commit", "value": f"`{os.environ['SHA'][:7]}`", "inline": True},
                      {"name": "Logs", "value": f"[View Workflow]({os.environ['RUN_URL']})", "inline": True}
                  ]
              }]
          }

          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Deploy-Notifier"}
          )
          urllib.request.urlopen(req)
          EOF
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LIVE_OUTCOME: ${{ steps.live_check.outcome }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
